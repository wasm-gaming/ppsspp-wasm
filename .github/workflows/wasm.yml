# Building PPSSPP itself.
#
# Deliberately not part of the PR build: this is a ~40 minute Emscripten compile of a
# million-line C++ codebase, and the contract implementation in src/ does not depend on
# its output — it is written against the interface in src/module.ts and tested against
# a fake. Running it on every pull request would buy nothing and cost an hour.
name: Build wasm

# Manual only, and it stays that way until native/patches/ actually contains the
# Emscripten port. Upstream PPSSPP has no Emscripten support, so an unpatched tree
# cannot configure, let alone build: a push trigger here would do nothing but burn
# forty minutes and paint every branch red. Add the push trigger in the same commit
# that makes this able to pass.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Link with the instruments (ASSERTIONS, PTHREADS_DEBUG, names in stack traces)"
        type: boolean
        default: false
      smoke:
        description: "Boot the result in a real browser and report whether the tab survived"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wasm
  cancel-in-progress: true

env:
  # ccache is what makes a failed round cheap. Without it every round recompiles the
  # 699 targets that already worked in order to reach the one that did not, and a
  # ten-minute round buys a single diagnosis. `EM_COMPILER_WRAPPER` is Emscripten's own
  # hook and is the right one to use here: it puts ccache in front of the *clang*
  # invocation emcc finally makes, which is a command line ccache understands, rather
  # than in front of emcc's Python driver, which it does not.
  EM_COMPILER_WRAPPER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Well under GitHub's 10 GB per-repository cache budget, which this shares with the
  # Emscripten port cache below.
  CCACHE_MAXSIZE: 2G
  # The upstream checkout is thrown away and re-cloned every round, so every source
  # file arrives with a fresh path-and-mtime. `basedir` rewrites absolute paths in the
  # hash and `include_file_mtime` stops mtime alone from counting as a change — between
  # them, an identical source recompiled in a fresh tree is still a cache hit.
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,locale

jobs:
  wasm:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build ccache ca-certificates

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Two caches, and they hold different things. ccache holds this project's own
      # object files; the Emscripten cache holds the toolchain's — libc, libc++ and the
      # SDL3, freetype and harfbuzz ports, none of which come prebuilt for the
      # pthreads+SIMD+exceptions variant this build asks for, and all of which are
      # rebuilt from scratch on a cold runner.
      #
      # Both are rolling caches: the key carries the run id so every round saves the
      # state it ends with, and restore-keys picks up the most recent previous round.
      # A cache entry is immutable once written, so a fixed key would freeze the first
      # round's misses forever.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ github.run_id }}
          restore-keys: wasm-ccache-

      - name: Restore the Emscripten cache
        uses: actions/cache/restore@v4
        with:
          path: /emsdk/upstream/emscripten/cache
          key: wasm-emcache-5.0.7-${{ github.run_id }}
          restore-keys: wasm-emcache-5.0.7-

      # Fetches the revision pinned in native/UPSTREAM and applies native/patches/.
      - name: Check out PPSSPP
        run: make native-checkout

      # `make wasm-release` passes ninja `-k 0`, so this collects every independent
      # failure in one round rather than stopping at the first. The log is kept because
      # a round with fifty failures is unreadable in the web UI and worth a lot as a
      # file.
      - name: Build
        id: build
        # `shell: bash` is load-bearing, not decoration. The default shell for a `run`
        # step is `bash -e {0}` — no `pipefail` — so `make | tee` reports tee's exit
        # status and a build with fifty compile errors comes back green. Naming the
        # shell is what gets `-o pipefail`; the explicit `set` says so out loud.
        #
        # continue-on-error, because a failed step ends the job, and the caches are
        # saved by steps that come after this one. Every round of a port in progress is
        # a failed round, so a cache that only survives success is a cache that never
        # exists. The job is failed deliberately by the last step instead.
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          make wasm-release 2>&1 | tee build.log
        env:
          # Link-only flags, so turning the instruments on costs a relink and not a
          # rebuild of 1118 targets. See WASM_DEBUG_FLAGS in the Makefile.
          DEBUG: ${{ inputs.debug && '1' || '' }}

      # Runs even when the build succeeded: a successful build has no FAILED lines and
      # this says so in one line, which is a cheaper thing to read than a green tick.
      - name: Summarise the failures
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "No build.log — the build step never ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(grep -c '^FAILED: ' build.log || true)
          {
            echo "## Build round"
            echo
            echo "**$count** failing target(s)."
            if [ "$count" -gt 0 ]; then
              echo
              echo '```'
              grep '^FAILED: ' build.log | sed 's/^FAILED: //' | head -100
              echo '```'
              echo
              echo "First diagnostic of each failure — full output in the \`build-log\` artifact:"
              echo
              echo '```'
              grep -A 6 '^FAILED: ' build.log | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$count failing target(s)."

      - name: Report the ccache hit rate
        if: always()
        run: ccache --show-stats --verbose || ccache --show-stats || true

      # `actions/cache` saves in a post step guarded by success(), so on a red round it
      # saves nothing at all — which is every round until the port links. Restoring and
      # saving as separate steps, with `if: always()`, is what makes a failed round pay
      # for the next one.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ github.run_id }}

      - name: Save the Emscripten cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /emsdk/upstream/emscripten/cache
          key: wasm-emcache-5.0.7-${{ github.run_id }}

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-wasm
          path: src/native/
          if-no-files-found: error

      # The build's own verdict, applied after the caches are safe. Without this the
      # job would be green with a failed build in it.
      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "The build step failed — see the run summary and the build-log artifact."
          exit 1

  # Boot what the build produced, in a browser, and say whether the tab survived.
  #
  # A separate job on a plain runner rather than a step in the one above, for one
  # reason: the emsdk container has no browser in it, and installing one per round
  # costs more than moving a 40 MB artifact between jobs does. `ubuntu-latest` already
  # carries Chrome and Node.
  #
  # This is the half of a round that a compile log cannot report. The port currently
  # links, starts, initialises SDL3 and then stops, and none of that is visible from
  # `ninja` coming back green.
  smoke:
    needs: wasm
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the emulator
        uses: actions/download-artifact@v4
        with:
          name: ppsspp-wasm
          path: src/native

      - name: Boot it
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: make smoke SMOKE_TIMEOUT=120
