name: Build

on:
  # Every branch, not just main: work on this repository happens on branches long
  # before it becomes a pull request, and a CI that only runs on main is a CI that
  # tells you nothing until it is too late to be cheap.
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The contract implementation itself.
      - name: Typecheck
        run: make typecheck

      # Cleans dist/, rebuilds, then runs the compile-time conformance suite, the demo
      # (held to the same contract through checkJs) and the runtime tests.
      - name: Test
        run: make test

      # Not a deploy — building the site is how a broken typedoc entry point or a
      # missing demo file gets caught on the PR that breaks it.
      - name: Build site
        run: make site
